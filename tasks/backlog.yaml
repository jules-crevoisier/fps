  - id: ART-79B
    epic: E4
    title: Raccord et remplacement des matières peintes (make_tileable.py, découpe des planches 2×2, gen_textures protégé)
    priority: P0
    size: M
    model: sonnet
    agent: builder
    depends_on: []
    files: [tools/textures/make_tileable.py, tools/textures/hand_painted.yaml, tools/textures/tests/test_make_tileable.py, tools/textures/gen_textures.py, assets/textures/painted/HAND_PAINTED.txt]
    reads: [docs/art/WASTELAND_ART_RESET.md, assets/incoming/tripo/textures/SOURCES.md, docs/style/tokens.json, scripts/core/Cartoon.gd, tools/blender/ai_restyle.py]
    notes: >-
      Les planches 4K (grille 2×2 séparée par une gouttière noire, parfois un liseré d'encre au bord de chaque
      case) arriveront dans assets/incoming/tripo/textures/sheet_<A|B|C>_<a|b>.jpg (voir SOURCES.md) ; tant
      qu'elles sont absentes, tout se teste sur des planches synthétiques générées par les tests. Choix de
      variante du lead à inscrire tels quels dans hand_painted.yaml : A-a pour wood_planks, rust, painted_metal ;
      A-b pour corrugated_metal ; B-a pour terrain_sable, terrain_terre_battue, cracked_concrete ; B-b pour
      sand_dirt ; C-a pour wl_rock_strata, asphalt ; C-b pour wl_plaster, container_paint. Sorties :
      assets/textures/painted/material_<kind>_albedo.png (mêmes noms qu'aujourd'hui), terrain_sable_albedo.png,
      terrain_terre_battue_albedo.png, assets/textures/wasteland/wl_rock_strata_albedo.png et wl_plaster_albedo.png ;
      grime *_grime.png existants régénérés depuis la nouvelle albédo (zones sombres floutées), jamais du bruit.
      Méthode de raccord : coupe à erreur minimale (quilting Efros-Freeman, programmation dynamique numpy) sur une
      bande de recouvrement de 10–15 %, horizontalement puis verticalement ; PAS de fondu croisé (fantômes sur les
      planches et les nervures). Égalisation douce des basses fréquences (50 %) pour éviter les répétitions de
      taches ; luminance moyenne recalée à ±10 % de l'ancienne texture du même nom (le look ART-70 a été réglé
      dessus) ; sortie 1024², sRGB. Ne pas toucher Cartoon.gd ni les .import. gen_textures.py doit sauter tout
      fichier listé dans assets/textures/painted/HAND_PAINTED.txt (incident : il a déjà effacé des textures v2).
    acceptance: >-
      Détection des gouttières et découpe correctes sur planches synthétiques (avec et sans liseré, gouttière à
      ±3 % du centre). Raccord : écart moyen entre la dernière et la première colonne (et rangée) ≤ 1,5 × l'écart
      moyen entre colonnes voisines intérieures, testé sur 12 cases. Aucune teinte des bandes réservées d'équipe.
      gen_textures.py relancé ne modifie aucun fichier listé (test). Commande unique documentée :
      python tools/textures/make_tileable.py --config tools/textures/hand_painted.yaml [--dry-run], qui imprime
      une ligne TILE_OK/TILE_FAIL par matière et écrit une planche de contrôle (chaque matière en mosaïque 2×2).
      Si les sources sont présentes, l'exécuter et joindre la planche ; sinon le lead l'exécutera.

