    reads: [docs/STYLE_BIBLE.md, docs/style/tokens.json, docs/art/WASTELAND_ART_RESET.md, assets/shaders/ink_toon.gdshader]
    notes: >-
      Demande utilisateur 2026-09-25 : « crée-toi des outils en surcouche de Blender pour faire de la belle 3D et les
      textures toi-même ». Technique des jeux stylisés sans Substance : pour un .glb/.blend d'entrée, dépliage UV
      automatique si absent (Smart UV Project, marge 4 px), puis cuisson Cycles (EMIT) d'un shader stylisé vers une
      albédo 1024/2048 : couleur de base par slot (palette tokens.json ou textures peintes existantes en triplanaire),
      assombrissement teinté des creux (AO + Pointiness), éclaircissement des arêtes convexes et trait d'encre fin sur
      les arêtes vives (Pointiness/Bevel), dégradé de lumière vertical, bruit de coups de pinceau et variation de teinte
      par île UV. Sortie : .glb avec la texture cuite (matériau « <id>_painted », donc déjà pris en charge par
      Cartoon.painted_texture_prop côté jeu) + sidecar JSON. Corriger aussi turntable.py pour qu'il AFFICHE la
      baseColorTexture (aujourd'hui les modèles texturés y sortent en aplat bleu-gris).
      Réf. de la technique : manuel Blender « Render Baking », générateur de roches stylisées (arêtes vives + creux AO).
    acceptance: >-
      CLI : blender -b -P tools/blender/paint_bake.py -- --in X --out Y [--res 1024] [--palette kind]. Appliqué à 3
      modules du kit v2 (assets/models/props/wasteland/shanty/) et à 1 prop : turntables avant/après montrant arêtes
      éclaircies + encre, creux sombres, dégradé, grain peint ; tests (UV présents, texture non uniforme, pas de pixel
      hors palette réservée). captures: [reports/paint_bake/ avant/après]

