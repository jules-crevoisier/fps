  - id: ART-11Z
    epic: E4
    title: Rig Tripo — garder le repos T-pose d'origine (bras cassés dans les 46 animations) et re-rigger les 6 agents
    priority: P0
    size: M
    depends_on: [ART-11X]
    files: [tools/blender/rig_tripo_character.py, assets/models/characters/vif.glb, assets/models/characters/verrou.glb, assets/models/characters/roseau.glb, assets/models/characters/choc.glb, assets/models/characters/guet.glb, assets/models/characters/vanne.glb]
    reads: [tools/blender/make_characters.py, tools/character_shots.gd, docs/3D_PIPELINE.md, docs/style/character_prompts.md]
    notes: >-
      Constat du lead et de l'utilisateur (bande démo du 2026-09-24, Repos/Marche/Sprint/Tir/Roulade) : les bras sont
      cassés sur TOUS les agents Tripo alors que les animations elles-mêmes sont bonnes. Cause : _pose_arms_down
      applique une pose bras-le-long-du-corps FIXE comme NOUVEAU REPOS (pose.armature_apply) ; or les 46 actions UAL
      sont des rotations locales relatives au repos T-pose d'origine, donc chaque animation qui abaisse les bras les
      pousse une seconde fois (bras croisés, tordus, dans le torse). En plus, la cible fixe (0,15 ; 0,05 ; -0,97) ne
      correspond pas aux maillages en A-pose (bras à ≈ 40°) issus du gabarit de concept. Correctif attendu :
      (1) mesurer la direction réelle des bras du maillage (axe principal des sommets au-delà des épaules, par côté) ;
      (2) poser les os de bras sur cette direction et lier (poids automatiques + îlots rigides d'ART-11X) ;
      (3) reposer le squelette dans son orientation T-pose D'ORIGINE, appliquer le modificateur Armature pour cuire le
      maillage dans cette pose, rétablir le repos d'origine et remettre le modificateur (mêmes groupes de sommets).
      Choc (ART-11C, fusionnée ici) : zone de contact pouce/cuisse mal pondérée (mélange 70-76 %, arêtes étirées
      jusqu'à 8,9x) — les mains proches des cuisses doivent être liées aux os de main/avant-bras seulement, jamais
      mélangées avec la cuisse (lier les bras écartés du corps règle aussi ce cas).
      Le repos exporté doit être identique à celui de ual.glb, os par os. Sources : assets/incoming/tripo/verrou_v1.glb,
      vif_v1.glb et assets/incoming/tripo/studio/<id>_v1.glb.
    acceptance: >-
      Pour chaque os, le repos exporté égale celui de ual.glb (écart d'orientation < 0,5°, vérifié par script) ;
      les 6 agents re-riggés, check_asset --asset-class character PASS ; bande démo anim_reel (Repos, Marche, Sprint,
      Tir, Roulade) de chaque agent : bras dans la pose attendue de l'animation, sans torsion ni traversée du corps,
      GIF joints au rapport ; Idle d'un agent Tripo superposable à celui d'un agent maison de make_characters.py.

