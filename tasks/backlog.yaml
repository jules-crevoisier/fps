# Backlog du projet — SPEC éditée à la main (l'état vit dans tasks/state.json).
# Outil : python tools/tasks/plan.py {validate|status|waves|ready|start|done|block|prompt|import|board}
# Règles : `files` = propriété exclusive en écriture (fichier, dossier ou glob) ; deux tâches dont
# les fichiers se recoupent ne tournent jamais en même temps. `depends_on` = ordre strict.
# Les `depends_on` d'une épopée s'appliquent à toutes ses tâches.
# IMPORTANT : `tasks:` doit rester la DERNIÈRE clé du fichier (l'import ajoute en fin de fichier).
version: 1
context: tasks/context.md

defaults:
  model: sonnet
  agent: builder
  priority: P2

epics:
  E0:
    title: Outillage & process
    goal: Revue automatique, sondes de gameplay, pipeline 3D, planification. Tout le reste s'appuie dessus.
  E1:
    title: Stabilité & bugs
    goal: Zéro bug bloquant, zéro erreur Godot dans une partie de 10 minutes.
  E2:
    title: Sensations de jeu
    goal: Tir, mouvement et retours (visuels, sonores, caméra) au niveau d'un shooter du commerce.
    depends_on: [RES-01]
  E3:
    title: Bots
    goal: Des bots crédibles, réglables en difficulté, qui jouent l'objectif et utilisent leurs capacités.
    depends_on: [RES-01, AUD-01]
  E4:
    title: Direction artistique & 3D
    goal: Appliquer la bible de style v3 aux personnages, armes, décors, shaders et effets.
    depends_on: [ART-00, OPS-03]
  E5:
    title: Interface
    goal: Toutes les interfaces refaites selon la bible de style, lisibles en 720p et 1080p.
    depends_on: [ART-00, RES-02]
  E6:
    title: Cartes
    goal: Cartes lisibles, métriques justes, flux de jeu équilibrés pour chaque mode.
    depends_on: [RES-02]
  E7:
    title: Technique, perf & réseau
    goal: 144 i/s sur la machine de dev, pas de saccade de compilation de shaders, réseau robuste.
    depends_on: [RES-03]
  E8:
    title: Fun, méta & rétention
    goal: Boucles de session et de progression, onboarding, identité du jeu.
    depends_on: [RES-02]

