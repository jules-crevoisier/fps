  - id: TOOL-02B
    epic: E4
    title: Roches v2 « taillées à la serpe » + mesas à terrasses + paroi de canyon, texture peinte de strates alignée à l'horizontale
    priority: P0
    size: M
    model: opus
    agent: builder
    depends_on: [TOOL-01, TOOL-02]
    files: [tools/blender/make_stylized_rocks.py, tools/blender/tests/test_make_stylized_rocks.py, assets/models/props/wasteland/rocks/]
    reads: [assets/textures/wasteland/wl_rock_strata_albedo.png, tools/blender/paint_bake.py, docs/STYLE_BIBLE.md, docs/research/img/wasteland_v4_plan.png]
    notes: >-
      Verdict du lead sur TOOL-02 (2026-09-25) : techniquement propre mais visuellement faux — rochers en œufs lisses,
      falaises et mesas en piles de crêpes cylindriques, bord de canyon en escalier. Techniques imposées :
      ROCHERS = icosphère subdiv 2 étirée non uniformément puis 6–10 coupes planes aléatoires (bmesh.ops.bisect_plane,
      clear_outer) orientées surtout horizontal dessus / vertical flancs pour de grandes facettes planes, puis 2e passe
      de petites coupes et biseau 1 segment de 2–4 cm pour accrocher l'encre ; jamais de symétrie radiale visible.
      FALAISES / MESAS = contour 2D irrégulier (12–24 sommets, rayon bruité, pas un cercle) extrudé en 3–5 terrasses avec
      retraits/avancées différents par terrasse, rainures verticales par coupes planes près des arêtes, blocs éboulés
      au pied ; dessus plat avec lèvre. PAROI DE CANYON = mur long extrudé dont la face est taillée par coupes planes et
      terrasses, raccordable aux deux bouts. MATIÈRE = la texture peinte assets/textures/wasteland/wl_rock_strata_albedo.png
      (déjà raccordable) projetée en boîte à l'échelle du monde (1 tuile = 2 m) avec les strates TOUJOURS horizontales,
      dessus des terrasses en sable clair ; puis paint_bake.py pour cuire AO/creux et éclat des arêtes par-dessus.
    acceptance: >-
      Les 12 pièces régénérées ; planche de contrôle avec la texture VISIBLE (turntable corrigé par TOOL-01) ; aucune
      silhouette ovoïde ni cylindrique empilée ; strates horizontales continues d'une facette à l'autre ; budgets TOOL-02
      tenus ; check_asset PASS. Validation visuelle du lead sur la planche avant « done ». captures: [planche des 12]

