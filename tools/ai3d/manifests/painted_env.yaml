# =====================================================================================
# tools/ai3d/manifests/painted_env.yaml
# ART-80 — import Tripo « peinture conservée » : les 7 repères Wasteland déjà exportés
# depuis Tripo Studio (assets/incoming/tripo/studio/wl_*.glb, texture peinte 2048²,
# 2,4-5,6 k tris — docs/art/WASTELAND_ART_RESET.md) vers assets/models/props/wasteland/
# tripo/, via tools/blender/ai_import_painted.py — JAMAIS tools/blender/ai_restyle.py :
# celui-ci jette la texture IA (remplacée par une couleur de palette plate) et remesh en
# voxel, ce qui a mutilé ces mêmes 7 repères à la vague 1 (treillis fondus : derrick
# amputé à 0,92 m, grue coupée à 3,15 m — docs/research/09_wasteland_vertical_slice.md
# §7/l.144). ai_import_painted.py ne remesh JAMAIS : import, fusion des sommets quasi
# confondus, retrait des îlots < 1 % de la diagonale, décimation collapse jusqu'au
# budget, échelle uniforme, pivot au sol centré, albédo conservé (redimensionné, jamais
# quantifié), couleurs de sommet AO+Curvature — voir l'en-tête de ce script.
#
# SCHÉMA — un bloc top-level (3 clés communes) + une liste `assets`, chaque entrée a
# EXACTEMENT ces 6 clés :
#   id            str    identifiant, matche le nom de fichier source (wl_<nom>.glb)
#   source        str    chemin du .glb brut Tripo Studio, relatif à la racine du dépôt
#   height_m      float  hauteur cible (échelle uniforme, axe vertical) en mètres
#   budget_tris   int    budget LOD0 après décimation — plafond dur ART-80 : <= 6000
#   texture_size  int    1024 ou 2048 — taille cible de l'albédo conservé (jamais
#                        quantifié ; ai_import_painted.py ne l'agrandit jamais au-delà
#                        de la taille d'origine, voir resolved_texture_size())
#   notes         str    français : provenance de la cote, contexte carte
#
# COTES — dérivées du contrat ART-80 (« château d'eau 9-11 m, derrick 14-18 m,
# panneaux 5-7 m… ») là où il est explicite, complétées par docs/research/
# 09_wasteland_vertical_slice.md §b.10/l.607-608 (« grue 18 m, derrick 14 m au-dessus
# de la butte, château d'eau 8,8 m au-dessus du toit ») pour les repères non couverts
# par la liste tronquée du contrat (grue, cuve, auvent) — un choix documenté ici,
# jamais deviné en silence : à reconfirmer par le lead d'ART-82 (intégration carte)
# avant de recaler le Kit (poteaux/pieds/boîtes) sur ces nouvelles hauteurs.
# =====================================================================================
output_dir: assets/models/props/wasteland/tripo
min_island_ratio: 0.01
merge_ratio: 0.0005
assets:
- id: wl_water_tower
  source: assets/incoming/tripo/studio/wl_water_tower.glb
  height_m: 10.0
  budget_tris: 6000
  texture_size: 2048
  notes: 'Château d''eau — contrat ART-80 explicite « 9-11 m » : 10,0 m (milieu de plage, proche des 8,8 m au-dessus du toit de recherche §b.10). Repère ouest sur le Réservoir (ASSET_PLAN.md l.242) ; A/B restylé vs peint (planche de vérification ART-80).'
- id: wl_oil_derrick
  source: assets/incoming/tripo/studio/wl_oil_derrick.glb
  height_m: 16.0
  budget_tris: 6000
  texture_size: 2048
  notes: 'Derrick rouille — contrat ART-80 explicite « 14-18 m » : 16,0 m (milieu de plage ; recherche §b.10 donne 14 m au-dessus de la butte, ASSET_PLAN.md l.243 visait 10 m avant ce contrat). Repère rouge, site A. A/B restylé vs peint (planche de vérification ART-80).'
- id: wl_crane_lattice
  source: assets/incoming/tripo/studio/wl_crane_lattice.glb
  height_m: 18.0
  budget_tris: 6000
  texture_size: 2048
  notes: 'Grue — hors de la liste explicite du contrat ART-80 (« … ») ; 18,0 m reprend docs/research/09_wasteland_vertical_slice.md l.607 (« grue 18 m »). Repère neutre central (ASSET_PLAN.md l.244).'
- id: wl_fuel_billboard
  source: assets/incoming/tripo/studio/wl_fuel_billboard.glb
  height_m: 6.0
  budget_tris: 4000
  texture_size: 1024
  notes: 'Panneau FUEL — contrat ART-80 explicite « panneaux 5-7 m » : 6,0 m (plein jusqu''au sol, ASSET_PLAN.md l.240). Repère du spawn bleu.'
- id: wl_canopy_station
  source: assets/incoming/tripo/studio/wl_canopy_station.glb
  height_m: 5.5
  budget_tris: 4000
  texture_size: 2048
  notes: 'Auvent FUEL — hors de la liste explicite du contrat (« … ») ; rangé du côté « panneaux 5-7 m » (bandeau FUEL en façade) plutôt que laissé à son ancienne cote ASSET_PLAN.md l.241 (4,1 m), pour une silhouette plus lisible (WASTELAND_ART_RESET.md). A/B restylé vs peint (planche de vérification ART-80) : à reconfirmer à l''intégration (ART-82, poteaux Kit).'
- id: wl_gas_billboard
  source: assets/incoming/tripo/studio/wl_gas_billboard.glb
  height_m: 6.0
  budget_tris: 3000
  texture_size: 1024
  notes: 'Panneau GAS — contrat ART-80 explicite « panneaux 5-7 m » : 6,0 m en autonome (le panneau seul, sans le toit du GasOffice sur lequel il vient se poser en carte — ASSET_PLAN.md l.245 visait 2,5 m posé sur un toit à 3,2 m, soit 5,7 m au total, dans la même plage). Repère du spawn rouge.'
- id: wl_tank_horizontal
  source: assets/incoming/tripo/studio/wl_tank_horizontal.glb
  height_m: 3.5
  budget_tris: 3000
  texture_size: 1024
  notes: 'Cuve horizontale — hors de la liste explicite du contrat ; cote inchangée d''ASSET_PLAN.md l.246 (couvert debout, boîte Kit 3 x 3,5 x 5). Repère rouge « réservoirs ».'
# --- ART-82 (coin beauté Grand-Rue) : les 4 bâtiments Tripo peints livrés par
# ART-83 (assets/incoming/tripo/studio/wl_saloon|wl_fuel_store|wl_garage|
# wl_shack.glb — concepts isolés fond uni, vue 3/4, encre épaisse, Smart Mesh
# x4, docs/art/WASTELAND_ART_RESET.md), installés ici avec la MÊME convention
# que les 7 repères d'ART-80 ci-dessus (ai_import_painted.py, jamais
# ai_restyle.py). Cotes reprises TELLES QUE le contrat ART-82 les donne
# (« saloon et magasin ~8-9 m de haut, garage ~5 m, cabane ~4,5 m ») : chaque
# valeur retenue est le milieu de sa plage, même méthode que les notes ART-80
# ci-dessus. budget_tris reste sous le plafond dur de 6000 (en-tête de ce
# fichier) même si l'acceptance ART-83 tolère jusqu'à 12 000 tris bruts : ce
# manifeste ne régit que la sortie DÉCIMÉE consommée en jeu, pas le livrable
# Tripo brut d'ART-83. Collisions (rappel du contrat ART-82, hors de ce
# fichier) : boîtes simples posées par la scène de dev, jamais ce maillage IA.
- id: wl_saloon
  source: assets/incoming/tripo/studio/wl_saloon.glb
  height_m: 8.5
  budget_tris: 6000
  texture_size: 2048
  notes: 'Saloon 2 niveaux à balcon (ART-83) — contrat ART-82 « saloon … ~8-9 m » : 8,5 m (milieu de plage). Bâtiment ouest, le plus proche caméra dans le coin beauté ; étage ≈ 3 m (ASSET_PLAN.md, cote ART-83 « étage 3 m »).'
- id: wl_fuel_store
  source: assets/incoming/tripo/studio/wl_fuel_store.glb
  height_m: 8.0
  budget_tris: 6000
  texture_size: 2048
  notes: 'Magasin à fronton FUEL (ART-83) — contrat ART-82 « … magasin ~8-9 m » : 8,0 m (milieu de plage, fronton légèrement plus bas que le saloon voisin). Bâtiment ouest, enseigne FUEL au premier plan comme wasteland_hero.png.'
- id: wl_garage
  source: assets/incoming/tripo/studio/wl_garage.glb
  height_m: 5.0
  budget_tris: 5000
  texture_size: 2048
  notes: 'Garage à grande porte (ART-83) — contrat ART-82 explicite « garage ~5 m » : 5,0 m. Bâtiment est, porte 2,2 m de haut (ASSET_PLAN.md, cote ART-83 « porte 2,2 m »).'
- id: wl_shack
  source: assets/incoming/tripo/studio/wl_shack.glb
  height_m: 4.5
  budget_tris: 4000
  texture_size: 2048
  notes: 'Cabane basse (ART-83) — contrat ART-82 explicite « cabane ~4,5 m » : 4,5 m. Bâtiment est, remplit l''arrière-plan bas entre le garage et l''entrepôt.'
# --- ART-89 (4 grappes de décor, coin beauté v3) : verdict utilisateur/lead du 2026-09-25 —
# les props procéduraux du dressing (assets/models/props/wasteland/*.glb, hors tripo/) font
# jouet (épaves en blocs rouges, panneaux bleus). Sources fraîchement livrées par Tripo Studio
# (assets/incoming/tripo/studio/wl_car_wreck|wl_fence_broken|wl_market_stall|wl_junk_pile.glb),
# installées ici avec la MÊME convention que les 11 repères/bâtiments ci-dessus
# (ai_import_painted.py, jamais ai_restyle.py). budget_tris reste sous le plafond dur de 6000
# (en-tête de ce fichier, même choix documenté que le bloc ART-82 ci-dessus) même si
# l'acceptance ART-89 tolère jusqu'à 15 000 tris BRUTS (Smart Mesh Tripo Studio, avant
# décimation) : ce manifeste ne régit que la sortie DÉCIMÉE consommée en jeu.
- id: wl_car_wreck
  source: assets/incoming/tripo/studio/wl_car_wreck.glb
  height_m: 2.3
  budget_tris: 6000
  texture_size: 2048
  notes: 'Épave de berline peinte (ART-89, remplace le "sedan_wreck"/"truck_wreck" procéduraux "en blocs rouges") — contrat « berline ~4,8 m » : longueur, pas hauteur (height_m scale l''axe VERTICAL, voir l''en-tête de ce fichier). Premier essai à 1,5 m (proportion "juste la caisse" du sedan_wreck procédural, h=1,4/d=4,9) ne donnait que 3,16 m de long une fois à l''échelle -- ratio RÉEL de ce maillage (capot ouvert + roue de secours posée au sol, toutes deux DANS la bbox) mesuré au turntable : longueur/hauteur = 2,11, plus trapu qu''une vraie berline (~3,5). 2,3 m fait remonter la longueur à ~4,8 m (contrat, seul chiffre explicite donné) ; le capot ouvert culmine donc plus haut qu''un toit de berline réel, mais reste cohérent avec une épave (capot arraché) -- vérifié au turntable, silhouette lisible.'
- id: wl_fence_broken
  source: assets/incoming/tripo/studio/wl_fence_broken.glb
  height_m: 2.0
  budget_tris: 4000
  texture_size: 1024
  notes: 'Clôture cassée peinte (ART-89, remplace la rangée "fence_chainlink" — "panneaux bleus" du verdict) — contrat explicite « section ~4 m, 2 m de haut » : 2,0 m.'
- id: wl_market_stall
  source: assets/incoming/tripo/studio/wl_market_stall.glb
  height_m: 2.8
  budget_tris: 6000
  texture_size: 2048
  notes: 'Étal de marché peint (ART-89, nouvelle sorte de dressing DressingKit) — contrat explicite « ~3 m de large, 2,8 m de haut » : 2,8 m.'
- id: wl_junk_pile
  source: assets/incoming/tripo/studio/wl_junk_pile.glb
  height_m: 1.8
  budget_tris: 5000
  texture_size: 1024
  notes: 'Bric-à-brac peint (ART-89, grosse grappe de fouillis — distinct du petit "junk_pile" procédural déjà catalogué, assets/models/props/manifest.json) — contrat explicite « ~2 m, 1,8 m de haut » : 1,8 m.'
