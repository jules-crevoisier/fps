# =====================================================================================
# tools/ai3d/manifests/weapon_rigs.yaml
# FP-11 -- contrat "arme v2" (docs/research/12_viewmodel_v2.md §3.3) : pour chacune des 7
# armes peintes (assets/models/weapons/_painted_v1/<id>.glb, copie figee d'A3D-20), deplace
# le MAILLAGE pour que l'origine tombe sur la poignee, pose les reperes
# Grip/Foregrip/Sight/MagWell/Eject sur la VRAIE surface et decoupe les pieces mobiles --
# via tools/blender/rig_weapon_parts.py, qui ecrit assets/models/weapons/v2/<id>.glb.
#
# MESURE, PAS DEVINE (§3.3) : chaque coordonnee ci-dessous est lue sur les planches cotees
# (grille 1 cm) de tools/blender/weapon_blueprint.py rendues sur les 7 _painted_v1/*.glb --
# reports/checkpoints/2026-09-25_FP-11/plans_v1/ (vues completes) et plans_v1/detail/
# (planches de detail --frame-cm, une etiquette par cm) -- puis ajustee au millimetre par
# lancer de rayons sur le maillage (surface droite/gauche/haut/bas au point lu sur la
# planche) et par la silhouette de profil rasterisee au millimetre (ouverture du pontet,
# bords de poignee). Repere de travail = NATIF Blender (Z-up) apres reimport du .glb :
# X = largeur (+ = droite du tireur), Y = axe canon (+ = vers la bouche), Z = hauteur.
# Coordonnees AVANT mise a l'echelle : rig_weapon_parts.py applique la meme transformation
# (translation + echelle uniforme) a CHAQUE coordonnee de ce fichier.
#
# REGLES DE POSE (communes aux 7 armes, revue du lead 2026-09-25) :
#   Grip      paume droite = creux de la main sur la poignee : a la hauteur du pontet
#             (60 % de la hauteur de son ouverture, sous le bas de la carcasse), au tiers
#             arriere de la section de la poignee a cette hauteur (poignee pistolet : depuis
#             la bande arriere ; crosse a poignet -- Marqueur, Fracas, Faucheur : depuis la
#             verticale du creux du poignet), 0,7 cm a l'interieur du flanc DROIT (la paume
#             s'y pose ; le point reste a <= 1 cm de la surface, dans la silhouette).
#   Foregrip  main gauche : surface basse du garde-main / de la pompe (fusils, SMG) ; flanc
#             GAUCHE de la poignee, 0,3 cm a l'interieur (pistolets : main d'appui).
#   Sight     ligne de visee au bord haut de la hausse, dans le plan median de l'arme ;
#             lunettes (Marqueur, Faucheur) : centre de la face arriere de l'oculaire.
#             Magnum : la sangle superieure n'est qu'a 2,1 cm au-dessus de l'axe de l'ame
#             (planche plans_v1/detail/magnum_profile_hammer_cyl.jpg) -- le Sight est pose a
#             axe + 3,1 cm (echelle comprise), soit 1 cm au-dessus de la hausse, pour tenir a
#             la fois ">= 3 cm au-dessus de l'axe" et "<= 1,5 cm de la surface".
#   MagWell   entree du puits de chargeur : flanc droit du chargeur (0,3 cm dedans) a la
#             hauteur ou il entre dans la carcasse ; Pistolet : flanc droit du talon de
#             chargeur au bas de la poignee ; Fracas (tube) : fenetre de chargement sous la
#             carcasse ; Magnum : face arriere du barillet, sur son axe.
#   Eject     fenetre d'ejection, flanc DROIT (surface touchee par un rayon venant de +X).
#   Muzzle    PAS de coordonnee ici : mesure sur le maillage (centre de la face la plus
#             avancee du canon, rig_weapon_parts.py::bore_tip_point).
#
# SCHEMA -- un bloc top-level (6 cles) + une liste `weapons`, chaque entree :
#   id                 str      identifiant, matche _painted_v1/<id>.glb et v2/<id>.glb
#   grip_span_m        float    longueur mesuree (AVANT echelle) de la poignee, du creux
#                               de la main (sous la carcasse / creux du poignet) au talon
#                               -- echelle = target_grip_length_m / grip_span_m
#   grip_local         [x,y,z]  Grip (= l'origine apres transformation)
#   foregrip_local     [x,y,z]  Foregrip
#   sight_local        [x,y,z]  Sight
#   magwell_local      [x,y,z]  MagWell
#   eject_local        [x,y,z]  Eject
#   pieces             list     pieces mobiles (§3.3), chacune :
#     name             str      nom exact du maillage exporte ("Body" reste implicite :
#                               c'est tout ce qui n'est dans AUCUNE piece)
#     box_min/box_max  [x,y,z]  boite de decoupe (une face part avec la piece si son
#                               centroide y tombe)
#     box2_min/box2_max [x,y,z] seconde boite, optionnelle, toujours par paire (union des
#                               deux) -- quand une boite seule ne separe pas la piece
#     pivot            [x,y,z]  origine de la piece apres decoupe
# =====================================================================================
weapons_dir: assets/models/weapons
painted_v1_dir: assets/models/weapons/_painted_v1
output_dir: assets/models/weapons/v2
default_budget_tris: 8000
target_grip_length_m: 0.115
min_iou: 0.98

weapons:
# Pistolet -- pontet h 10,9-15,2 cm ; poignee a h 13,5 : bande arriere -1,5, avant 8,1 ;
# largeur -2,72..+2,80 ; creux (sous le bec, h 16,0 / y -2,9) -> talon (h 2,4 / y -4,6).
- id: pistolet
  grip_span_m: 0.137
  grip_local: [0.0210, 0.0140, 0.1350]
  foregrip_local: [-0.0242, 0.0150, 0.0800]
  sight_local: [0.0, 0.0060, 0.2600]
  magwell_local: [0.0195, 0.0160, 0.0190]
  eject_local: [0.0161, 0.1200, 0.2250]
  pieces:
  # Glissiere : tout le bloc superieur au-dessus de h 16,9 jusqu'a sa face avant (24,4 ;
  # la bague rouge commence a 24,5 et reste sur le canon, donc sur Body).
  - name: Slide
    box_min: [-0.06, -0.06, 0.169]
    box_max: [0.06, 0.2442, 0.27]
    pivot: [0.0, -0.045, 0.206]
  # Chargeur : talon visible sous la poignee (y -3,0..6,2 ; h 0,0..2,0).
  - name: Mag
    box_min: [-0.06, -0.035, -0.005]
    box_max: [0.06, 0.066, 0.015]
    pivot: [0.0, 0.016, 0.019]

# Magnum -- pontet h 5,8-8,6 ; poignee a h 7,5 : bande arriere -4,05, avant 1,3 ; flancs
# -1,39..+1,39 ; barillet y 4,1-10,2, h 9,6-15,0, axe h 12,4 ; sangle superieure h 16,45.
- id: magnum
  grip_span_m: 0.117
  grip_local: [0.0069, -0.0240, 0.0750]
  foregrip_local: [-0.0125, -0.0310, 0.0400]
  sight_local: [0.0, 0.0290, 0.1749]
  magwell_local: [0.0, 0.0430, 0.1240]
  eject_local: [0.0239, 0.0700, 0.1230]
  pieces:
  # Barillet : fenetre de la carcasse (y 4,0-10,3, h 9,5-15,1), pivot sur l'axe de la grue
  # (bas-gauche du barillet, face avant) -- il bascule a gauche pour le rechargement.
  - name: Cylinder
    box_min: [-0.030, 0.041, 0.0955]
    box_max: [0.030, 0.1025, 0.1505]
    pivot: [-0.017, 0.102, 0.107]
  # Chien : crete et corps derriere la carcasse (y -2,2..2,2 ; h 12,3..16,2), pivot sur
  # son axe bas.
  - name: Hammer
    box_min: [-0.010, -0.022, 0.123]
    box_max: [0.010, 0.022, 0.162]
    pivot: [0.0, 0.015, 0.126]

# Rafale -- pontet h 19,0-22,7 ; poignee a h 21,2 : bande arriere -1,1, avant 4,7 ; flancs
# -5,80..-1,77 (plan median x -3,8) ; creux (h 22,7 / y -1,4) -> talon (h 10,5 / y -4,0).
- id: rafale
  grip_span_m: 0.125
  grip_local: [-0.0247, 0.0090, 0.2120]
  foregrip_local: [-0.0380, 0.2520, 0.2226]
  sight_local: [-0.0380, 0.0080, 0.3660]
  magwell_local: [-0.0175, 0.1660, 0.1840]
  eject_local: [-0.0174, 0.1600, 0.3000]
  pieces:
  # Chargeur : sous le puits (y 13,1-20,2 a h 18 ; bas h 0,5-2,5) ; le levier en y 10,5-11,7
  # et la poignee avant (y > 26) restent sur Body.
  - name: Mag
    box_min: [-0.09, 0.128, -0.005]
    box_max: [0.01, 0.246, 0.185]
    pivot: [-0.038, 0.166, 0.187]

# Marqueur (crosse a poignet) -- pontet h 9,8-13,3 ; poignet a h 11,9 : avant -3,6, creux
# du poignet y -10,3 (h 17,8), calotte h 4,8 ; flancs -3,62..+3,62 ; lunette h 28-36,3.
- id: marqueur
  grip_span_m: 0.130
  grip_local: [0.0292, -0.0850, 0.1190]
  foregrip_local: [0.0005, 0.3200, 0.1362]
  sight_local: [0.0005, -0.0362, 0.3210]
  magwell_local: [0.0219, 0.1640, 0.1290]
  eject_local: [0.0339, 0.1000, 0.2250]
  pieces:
  - name: Mag
    box_min: [-0.07, 0.102, -0.005]
    box_max: [0.07, 0.240, 0.130]
    pivot: [0.0005, 0.164, 0.132]

# Ravage -- pontet h 18,1-21,6 ; poignee a h 20,2 : bande arriere -4,8, avant 1,0 ; flancs
# -2,41..+0,75 ; creux (h 21,6 / y -5,2) -> talon (h 10,6 / y -6,9) ; hausse h 36,1.
- id: ravage
  grip_span_m: 0.111
  grip_local: [0.0005, -0.0306, 0.2020]
  foregrip_local: [-0.0083, 0.3100, 0.2164]
  sight_local: [-0.0083, 0.0080, 0.3610]
  magwell_local: [0.0074, 0.1180, 0.2130]
  eject_local: [0.0132, 0.1400, 0.2550]
  pieces:
  # Chargeur courbe : haut y 8,3-17,9 sous la carcasse (bas de carcasse h 21,6), bas qui
  # avance jusqu'a y 24 vers h 5. Deux boites : la seconde (y > 19) s'arrete a h 19,5 pour
  # laisser a Body la levre basse du garde-main (y 22-25, h 20,8-21,6 -- planche v2 du
  # premier passage : levre partie avec le chargeur). L'arretoir (y 7,2-7,7) reste aussi.
  - name: Mag
    box_min: [-0.05, 0.080, -0.005]
    box_max: [0.04, 0.190, 0.214]
    box2_min: [-0.05, 0.190, -0.005]
    box2_max: [0.04, 0.250, 0.195]
    pivot: [-0.0083, 0.118, 0.216]

# Fracas (crosse a poignet, plan median x +0,98) -- pontet h 9,7-13,2 ; poignet a h 11,8 :
# avant -16,5, creux du poignet y -22,1 (h 16,7), bas h 5,8 ; flancs -1,32..+3,27 ;
# carcasse haut h 24,46, bas h 13,59 ; pompe y 19-37,5, h 12,2-19,6.
- id: fracas
  grip_span_m: 0.109
  grip_local: [0.0257, -0.2050, 0.1180]
  foregrip_local: [0.0098, 0.2800, 0.1221]
  sight_local: [0.0098, -0.0400, 0.2446]
  magwell_local: [0.0098, 0.0200, 0.1359]
  eject_local: [0.0448, 0.0100, 0.2050]
  pieces:
  - name: Pump
    box_min: [-0.08, 0.186, 0.110]
    box_max: [0.09, 0.380, 0.199]
    pivot: [0.0098, 0.280, 0.174]

# Faucheur (poignee semi-pistolet, plan median x -4,73) -- pontet h 6,6-10,3 ; poignee a
# h 8,8 : avant -23,3, arriere -30,45 ; flancs -8,03..-1,44 ; creux du poignet (h 13,5 /
# y -27,8) -> calotte (h 2,5 / y -28,5) ; oculaire face arriere y -24,98, h 22,5-30,5.
- id: faucheur
  grip_span_m: 0.110
  grip_local: [-0.0214, -0.2830, 0.0880]
  foregrip_local: [-0.0473, 0.0800, 0.1205]
  sight_local: [-0.0473, -0.2498, 0.2650]
  magwell_local: [-0.0296, -0.0880, 0.1020]
  eject_local: [-0.0279, -0.0800, 0.1850]
  pieces:
  # Levier de culasse : tout ce qui depasse du flanc droit de la carcasse (x > -1,2) entre
  # y -17,5 et -11 ; pivot sur l'axe de la culasse (= axe du canon).
  - name: Bolt
    box_min: [-0.012, -0.175, 0.112]
    box_max: [0.118, -0.110, 0.185]
    pivot: [-0.0473, -0.145, 0.1905]
  # Chargeur : y -13,9..-3,7 sous la crosse (h 3-10,5) ; le pontet (jusqu'a y -14,3) reste.
  - name: Mag
    box_min: [-0.12, -0.141, 0.020]
    box_max: [0.02, -0.030, 0.104]
    pivot: [-0.0473, -0.088, 0.105]
