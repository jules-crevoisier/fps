# =====================================================================================
# tools/ai3d/manifests/wave3.yaml
# Vague 3 (P1/P2, alignée sur LORE.md v1.0) — objets de capacités, jeton du Sauf-conduit
# Plan : docs/assets/ASSET_PLAN.md (même source de données ; ne pas éditer l'un sans l'autre).
# Généré le 2026-09-24 pour tripo-cli 0.5.1. Estimation : 880 cr + réserve de relance 15 % = 1012 cr.
#
# SCHÉMA — chaque entrée de `assets` a EXACTEMENT ces 13 clés :
#   id            str   snake_case unique entre toutes les vagues ; préfixe = famille
#                       (wpn_ arme, wl_ Wasteland, cs_ Cargo Ship, cv_ couvert commun, dc_ décor commun, gp_ objet de jeu,
#                        ab_ objet de capacité, pf_/vp_/so_/cdv_/lf_/lb_ autres cartes)
#   category      str   weapon | prop | gameplay | ability | env
#   route         str   text | image | multiview
#   prompt        str   anglais, suffixe de style inclus. route=text : envoyé à text-to-model.
#                       route=image|multiview : description de provenance + repli text→3D si le concept
#                       est refusé deux fois (image-to-model ne prend pas de prompt).
#   image_prompt  str|null  prompt du générateur d'images Tripo (text-to-image) pour route=image ;
#                       pour route=multiview, vue de face qui alimente image-to-multiview ; null si route=text.
#   face_limit    int   passé tel quel. quad=true : nombre de QUADS (500–10 000, ≈ budget_tris / 2) ;
#                       quad=false : triangles (500–20 000). Bornes smart_low_poly de `tripo docs --topic commands/generate`.
#   quad          bool  true => sortie FBX forcée par la CLI (« quad topology cannot be stored in GLB »).
#   texture       bool  texture STANDARD, utilisée seulement comme source de couleur pour découper le maillage
#                       en slots (ai_restyle.py), puis jetée. Jamais texture_quality=detailed, jamais PBR.
#   smart_lowpoly bool  true => le runner DOIT forcer --model tripo-v3.1 (sinon la CLI choisit P1 dès que
#                       face_limit <= 20 000 et retire smart_low_poly : vérifié en --dry-run).
#   budget_tris   int   budget LOD0 final en triangles après restyle (STYLE_BIBLE §6.6) ; vérifié par check_asset.py.
#   scale_m       float dimension de référence finale en mètres : longueur totale (axe du canon) pour les armes
#                       et objets tenus ; hauteur (axe Y) pour tout le reste. bbox complète dans notes si utile.
#   priority      str   P0 | P1 | P2
#   notes         str   français : slots, collision, pièces séparées, marqueurs, décalques, contrôles CHK.
#
# TRADUCTION CLI (le runner exécute d'abord chaque commande en --dry-run --json et exige "valid": true) :
#   route=text      tripo make "<prompt>" --model tripo-v3.1 -p face_limit=<fl> -p smart_low_poly=<b>
#                     -p quad=<b> -p texture=<b> -p pbr=false -p negative_prompt="<negative_prompt>"
#                     --name <id> -o assets_src/ai_raw/<id> --json --yes
#   route=image     1) tripo generate text-to-image "<image_prompt>" --name <id>_concept
#                        -o assets_src/ai3d/concepts/<id> --json --yes
#                   2) PORTE : planche des concepts relue (silhouette, blocs de couleur, bandes réservées)
#                   3) tripo make assets_src/ai3d/concepts/<id>/<image>.png --model tripo-v3.1 -p face_limit=<fl>
#                        -p smart_low_poly=<b> -p quad=<b> -p texture=<b> -p pbr=false
#                        --name <id> -o assets_src/ai_raw/<id> --json --yes
#   route=multiview 1-2) comme route=image ; 3) tripo generate image-to-multiview <concept.png> --name <id>_mv
#                   4) télécharger front/left/back/right_view_url en front.png left.png back.png right.png
#                   5) tripo make front.png left.png back.png right.png --model tripo-v3.1 (mêmes -p) --name <id> ...
#   Ne jamais passer export_orientation ni auto_size : orientation et échelle sont fixées dans Blender.
#   Codes de sortie : 4 crédits insuffisants (arrêt de la vague), 5 politique de contenu (reformuler), 6 échec
#   remboursé (tripo redo), 9 limite de débit (attente exponentielle).
#
# APRÈS TÉLÉCHARGEMENT : provenance.json par asset (A3D-09), puis tools/blender/ai_restyle.py (A3D-07) :
#   nettoyage, échelle scale_m, origine au pied, quantification Lab de la texture vers la palette → slots,
#   texture jetée, biseau par classe, WEIGHTED_NORMAL, COLOR_0 (AO, arête, hauteur, zone), LOD1/LOD2,
#   collisions, marqueurs ; puis check_asset.py, turntable, captures Godot, style_check. Rien n'entre dans
#   assets/models/ avant ces contrôles.
# =====================================================================================
